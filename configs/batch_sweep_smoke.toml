# Smoke for benchmarks/batch_sweep.py on one Modal L4: laya.english in eager and graphs mode, three batch
# sizes at one short length, few batches. Checks the pipeline (pool, batching, timing, trace, write-back),
# not the numbers.
#   uv run --group modal s1 submit configs/batch_sweep_smoke.toml
#   uv run --group modal s1 submit configs/batch_sweep_smoke.toml --nsys 16
benchmarks = ["batch"]

[launch]
orchestrator = "modal"
gpu = "L4"
gpus = 1
cpus = 8
mem = "28G"
time = "00:30:00"

[invariants]
gpu_metrics = "detailed"
gpu_metrics_schema = 1
gpu = "auto"
laya_pad_multiple = 64

[params]
model = "laya.english"
batch_seed = 0
batch_pool = 16
batch_min_decisions = 8
batch_min_batches = 2
batch_trace = 1
batch_warmup = 4
batch_tokenizer_file = "$MODELS_DIR/Qwen3.5-4B-Base/tokenizer.json"

[sweep]
laya_mode = ["eager", "graphs"]

[grid]
batch_state_tokens = [128]
batch_sizes = [1, 4, 16]
